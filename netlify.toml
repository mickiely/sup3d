[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/ground/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/maps/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
