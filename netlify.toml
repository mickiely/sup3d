[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/ground/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/maps/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[redirects]]
  from = "/guest"
  to = "/guest.html"
  status = 200

[[redirects]]
  from = "/demo"
  to = "/demo.html"
  status = 200
